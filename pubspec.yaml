name: sim_bulk_sms
description: SIM-based bulk SMS campaign manager (Android direct send, iOS composer handoff).
publish_to: none
version: 1.0.1+3
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter: { sdk: flutter }
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  csv: ^6.0.0
  phone_numbers_parser: ^8.2.0   # libphonenumber-derived metadata
  file_picker: ^13.1.0
  google_sign_in: ^7.2.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_android: ^0.5.5
  in_app_purchase_storekit: ^0.4.15
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
# NOTE: versions are starting points. Run `flutter pub get`, commit pubspec.lock,
# and re-verify compatibility (not done in the authoring environment).

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans   # SIL Open Font License, assets/fonts/OFL.txt
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
