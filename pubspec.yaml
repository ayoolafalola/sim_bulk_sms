name: sim_bulk_sms
description: SIM-based bulk SMS campaign manager (Android direct send, iOS composer handoff).
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter: { sdk: flutter }
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  csv: ^6.0.0
  phone_numbers_parser: ^8.2.0   # libphonenumber-derived metadata
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
# NOTE: versions are starting points. Run `flutter pub get`, commit pubspec.lock,
# and re-verify compatibility (not done in the authoring environment).

flutter:
  uses-material-design: true
